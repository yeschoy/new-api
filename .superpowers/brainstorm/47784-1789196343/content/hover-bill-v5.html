<style>
  .stage { min-height:520px; padding-top:24px; }
  .preview { max-width:900px; margin:0 auto; border:1px solid var(--border); border-radius:20px; background:linear-gradient(180deg,#fbfdff,#fff); color:#0f172a; box-shadow:0 18px 48px rgba(15,23,42,.08); }
  .head { position:relative; padding:22px; }
  .title-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .title-row h3 { margin:0; font-size:16px; }
  .pill { padding:4px 8px; border-radius:999px; background:#eff6ff; color:#2563eb; font-size:10px; font-weight:760; }
  .tier { color:#64748b; font-size:11px; font-weight:650; }
  .help { position:relative; display:inline-flex; }
  .help-button { display:grid; place-items:center; width:20px; height:20px; padding:0; border:1px solid #cbd5e1; border-radius:50%; background:white; color:#64748b; font-size:12px; font-weight:800; cursor:help; }
  .help-button:hover,.help-button:focus-visible { color:#2563eb; border-color:#93c5fd; outline:3px solid rgba(37,99,235,.12); }
  .bill { position:absolute; z-index:20; top:30px; left:-8px; width:360px; padding:14px; border:1px solid #dbe3ef; border-radius:14px; background:white; color:#0f172a; box-shadow:0 18px 44px rgba(15,23,42,.18); opacity:0; visibility:hidden; transform:translateY(-4px); transition:.14s ease; }
  .help:hover .bill,.help:focus-within .bill,.help.open .bill { opacity:1; visibility:visible; transform:translateY(0); }
  .bill::before { content:''; position:absolute; top:-6px; left:12px; width:11px; height:11px; background:white; border-left:1px solid #dbe3ef; border-top:1px solid #dbe3ef; transform:rotate(45deg); }
  .bill-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid #e2e8f0; }
  .bill-head strong { font-size:12px; }
  .bill-head span { color:#64748b; font-size:10px; }
  .rows { margin-top:4px; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:12px; padding:9px 0; font-size:11px; }
  .row + .row { border-top:1px solid #f1f5f9; }
  .row b { font-size:11px; }
  .usage { color:#64748b; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .price { min-width:74px; text-align:right; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:760; }
  .bill-note { margin:6px 0 0; padding-top:9px; border-top:1px solid #e2e8f0; color:#64748b; font-size:10px; line-height:1.55; }
  .costs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:20px; }
  .fact span { display:block; color:#64748b; font-size:11px; }
  .fact strong { display:block; margin-top:5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:17px; }
  .empty { height:130px; border-top:1px solid #e2e8f0; background:linear-gradient(180deg,rgba(248,250,252,.45),rgba(255,255,255,0)); }
  .hint { max-width:900px; margin:14px auto 0; color:var(--muted); font-size:12px; text-align:center; }
  @media (max-width:620px) { .bill { position:fixed; top:50%; left:50%; width:min(360px,calc(100vw - 28px)); transform:translate(-50%,-48%); } .help:hover .bill,.help:focus-within .bill,.help.open .bill { transform:translate(-50%,-50%); } .bill::before { display:none; } .costs { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>

</div>
