<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply before any injected analytics scripts or external resources. The
         cashier is an order-only surface, never an analytics/account page. -->
    <script>
      if (/^\/partner\/checkout\/?$/.test(window.location.pathname)) {
        var cashierPolicy = document.createElement('meta')
        cashierPolicy.httpEquiv = 'Content-Security-Policy'
        cashierPolicy.content = "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'"
        document.head.appendChild(cashierPolicy)
        var cashierReferrer = document.createElement('meta')
        cashierReferrer.name = 'referrer'
        cashierReferrer.content = 'no-referrer'
        document.head.appendChild(cashierReferrer)
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/yeschoy-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>野菜</title>
    <meta name="title" content="野菜" />
    <meta
      name="description"
      content="野菜 · one OpenAI-compatible API for discounted models."
    />

    <meta name="theme-color" content="#07090d" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!-- Backend-injected analytics remain inert on the order-only cashier. -->
    <template id="site-analytics">
    <!--umami-->
    <!--Google Analytics-->
    </template>
    <script>
      ;(function () {
        var template = document.getElementById('site-analytics')
        if (!template) return
        if (!/^\/partner\/checkout\/?$/.test(window.location.pathname)) {
          template.content.querySelectorAll('script').forEach(function (original) {
            var script = document.createElement('script')
            Array.from(original.attributes).forEach(function (attribute) {
              script.setAttribute(attribute.name, attribute.value)
            })
            script.textContent = original.textContent
            document.head.appendChild(script)
          })
        }
        template.remove()
      })()
    </script>
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
