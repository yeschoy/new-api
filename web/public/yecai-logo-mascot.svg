  <title id="yc-title">野菜 · 呆萌小白菜</title>
  <desc id="yc-description">一颗圆滚滚的小白菜，戴着蓬松的浅绿叶帽，奶白色小脸上有豆豆眼、粉色腮红和微微张开的小嘴，两片小叶子抱着短短的菜梗，脚边放着金黄色圆片。透明背景，全部由可编辑矢量图形构成。</desc>
